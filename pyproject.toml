[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-cng"
version = "0.1.0"
description = "PhysChem-Constrained Counterfactual Negative Generator for reaction prediction"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [{name = "PC-CNG Authors"}]
keywords = ["chemistry", "reaction-prediction", "negative-sampling", "counterfactual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
chem = ["rdkit", "torch", "numpy", "pandas", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["chem_negative_sampling"]
include = ["pc_cng*"]

[tool.pytest.ini_options]
testpaths = ["chem_negative_sampling/tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools.package-data]
pc_cng = ["*.yaml", "*.yml", "*.json"]
